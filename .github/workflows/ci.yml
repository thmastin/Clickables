name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"
      - name: Install luac
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Run tests
        run: luajit tests/run.lua
      - name: Check Lua syntax
        run: find . -type d \( -name .git -o -name .lua \) -prune -o -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac -p
